name: Build Zereos Android APK

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'jenny/**'
      - 'requirements-android*.txt'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish current version metadata
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          gradle = Path("android/app/build.gradle.kts").read_text(encoding="utf-8")
          code = int(re.search(r"versionCode\\s*=\\s*(\\d+)", gradle).group(1))
          name = re.search(r'versionName\\s*=\\s*"([^"]+)"', gradle).group(1)
          Path("latest-version.json").write_text(json.dumps({
              "version_code": code,
              "version_name": name,
              "updated_at": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
          }, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-version.json
          git diff --cached --quiet || git commit -m "chore: update latest Android version metadata"
          git push

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zereos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
