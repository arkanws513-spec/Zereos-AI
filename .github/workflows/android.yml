name: Build Zereos Android APK

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'jenny/**'
      - 'requirements-android*.txt'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    # The metadata commit made by this workflow is deliberately skipped so
    # updating latest-version.json cannot trigger an endless build loop.
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish current version metadata
        working-directory: .
        run: |
          python3 - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts").read_text(encoding="utf-8")
          code_match = re.search(r"versionCode\s*=\s*(\d+)", gradle)
          name_match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          if not code_match or not name_match:
              raise SystemExit("Could not read versionCode/versionName from android/app/build.gradle.kts")

          Path("latest-version.json").write_text(
              json.dumps({
                  "version_code": int(code_match.group(1)),
                  "version_name": name_match.group(1),
                  "updated_at": datetime.now(timezone.utc).isoformat(),
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-version.json
          if ! git diff --cached --quiet; then
              git commit -m "chore: update latest Android version metadata [skip ci]"
              git push
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: zereos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: false

      - name: Publish direct APK release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_CODE=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' android/app/build.gradle.kts | grep -oE '[0-9]+)
          VERSION_NAME=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' android/app/build.gradle.kts | sed -E 's/.*"([^"]+)"/\\1/')
          TAG="zereos-v${VERSION_NAME}"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#Zereos-${VERSION_NAME}.apk" --clobber
          else
            gh release create "$TAG" "$APK#Zereos-${VERSION_NAME}.apk" \
              --title "Zereos ${VERSION_NAME}" \
              --notes "Zereos Android APK — version ${VERSION_NAME} (code ${VERSION_CODE})." \
              --target "$GITHUB_SHA"
          fi
