<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zereos AI</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:system-ui;display:flex;flex-direction:column;height:100vh}header{padding:14px;background:#111827;display:flex;justify-content:space-between}main{flex:1;overflow:auto;padding:16px}.msg{padding:10px 14px;margin:8px 0;border-radius:14px;white-space:pre-wrap}.user{background:#1d4ed8;margin-left:12%}.ai{background:#1f2937;margin-right:12%}form{display:flex;gap:8px;padding:10px;background:#111827}textarea{flex:1;background:#0f172a;color:#fff;border:1px solid #374151;border-radius:10px;padding:12px;font:inherit}button{background:#2563eb;color:white;border:0;border-radius:10px;padding:10px 14px}#status{padding:0 12px;color:#fbbf24}#settings{position:fixed;inset:0;background:#0b1020;padding:20px;display:none}#settings.show{display:block}input,select{width:100%;padding:12px;margin:8px 0 14px;background:#111827;color:#fff;border:1px solid #374151;border-radius:10px}</style></head><body><header><b>Zereos AI</b><button id="set">الإعدادات</button></header><main id="chat"><div id="welcome" style="text-align:center;color:#9ca3af;margin-top:35vh">مرحبًا بك في Zereos AI<br>اكتب رسالتك للبدء</div></main><div id="status"></div><form id="form"><textarea id="input" placeholder="اكتب رسالتك هنا..." rows="1"></textarea><button>إرسال</button></form><section id="settings"><button id="back">رجوع</button><h2>إعدادات Zereos AI</h2><label>المزوّد</label><select id="provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option><option value="qwen">Qwen</option></select><label>مفتاح API</label><input id="key" type="password"><label>النموذج</label><input id="model" value="gemini-2.5-flash"><button id="save">حفظ</button></section><script>const $=x=>document.getElementById(x),K="zereos_local_ai";let c=JSON.parse(localStorage.getItem(K)||"{}");$("provider").value=c.provider||"gemini";$("key").value=c.key||"";$("model").value=c.model||"gemini-2.5-flash";$("set").onclick=()=>$("settings").classList.add("show");$("back").onclick=()=>$("settings").classList.remove("show");$("save").onclick=()=>{c={provider:$("provider").value,key:$("key").value.trim(),model:$("model").value.trim()};localStorage.setItem(K,JSON.stringify(c));$("settings").classList.remove("show")};function add(t,w){$("welcome")?.remove();let d=document.createElement("div");d.className="msg "+w;d.textContent=t;$("chat").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight}async function ask(t){if(!c.key)throw Error("أضف مفتاح API من الإعدادات أولًا.");let p=c.provider||"gemini",m=c.model||"gemini-2.5-flash",r;if(p==="gemini")r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(m)+":generateContent?key="+encodeURIComponent(c.key),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{role:"user",parts:[{text:t}]}]})});else{let b={openai:"https://api.openai.com/v1",deepseek:"https://api.deepseek.com",qwen:"https://maas.qwencloudapi.com/compatible-mode/v1"}[p];r=await fetch(b+"/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+c.key},body:JSON.stringify({model:m,messages:[{role:"user",content:t}]})})}let d=await r.json();if(!r.ok)throw Error(d?.error?.message||"فشل الطلب");return p==="gemini"?d?.candidates?.[0]?.content?.parts?.map(x=>x.text||"").join(""):""+(d?.choices?.[0]?.message?.content||"لم يصل رد.")}$("form").onsubmit=async e=>{e.preventDefault();let t=$("input").value.trim();if(!t)return;$("input").value="";add(t,"user");$("status").textContent="جاري التفكير...";try{add(await ask(t),"ai")}catch(e){add("خطأ: "+e.message,"ai")}$("status").textContent=""}</script></body></html>
