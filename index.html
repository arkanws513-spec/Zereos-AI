<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>زيريوس AI</title>
<style>
:root{--bg:#070b14;--panel:#0d1422;--panel2:#111b2d;--line:#22304a;--text:#f5f7fb;--muted:#8d9bb3;--accent:#6d7cff;--accent2:#8d68ff;--user:#27355a;--ai:#111a2b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:radial-gradient(circle at 50% -20%,#1b2340 0,#0b1020 38%,var(--bg) 72%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.app{height:100%;display:flex;flex-direction:column}
header{height:68px;flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(7,11,20,.78);backdrop-filter:blur(16px)}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 28px #5968ff33}
.brand{min-width:0}.brand b{display:block;font-size:19px}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.head-actions{margin-right:auto;display:flex;gap:7px}
.icon-btn{border:1px solid var(--line);background:#0d1525;color:#cbd5e1;border-radius:11px;width:38px;height:38px;font-size:17px;cursor:pointer}
#chat{flex:1;overflow:auto;padding:22px 14px 18px;scroll-behavior:smooth}
.chat-inner{max-width:820px;margin:auto}
.welcome{text-align:center;padding:8vh 18px 20px}.welcome .orb{margin:auto auto 18px;width:72px;height:72px;border-radius:24px;display:grid;place-items:center;font-size:29px;font-weight:900;background:linear-gradient(135deg,#6575ff,#966cff);box-shadow:0 18px 50px #6677ff2b}
.welcome h1{font-size:25px;margin:0 0 8px}.welcome p{margin:0;color:var(--muted);line-height:1.7;font-size:14px}
.msg-row{display:flex;margin:13px 0}.msg-row.user{justify-content:flex-start}.msg-row.ai{justify-content:flex-end}
.msg{max-width:min(82%,680px);padding:13px 15px;border:1px solid rgba(255,255,255,.06);border-radius:18px;white-space:pre-wrap;word-break:break-word;line-height:1.75;font-size:15px;box-shadow:0 7px 24px #00000018}
.msg-row.user .msg{background:var(--user);border-bottom-right-radius:6px}.msg-row.ai .msg{background:var(--ai);border-bottom-left-radius:6px}
.meta{font-size:10px;color:#71809a;margin:4px 7px 0}
#status{height:25px;flex:none;text-align:center;color:var(--muted);font-size:11px;padding:4px}
.composer{flex:none;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(7,11,20,.96) 25%);}.composer-inner{max-width:820px;margin:auto;display:flex;align-items:flex-end;gap:8px;padding:7px;border:1px solid var(--line);background:rgba(13,20,34,.94);border-radius:18px;box-shadow:0 15px 45px #0005}
textarea{flex:1;min-height:42px;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:9px 10px;font:inherit;line-height:1.5}textarea::placeholder{color:#66748b}
.send{width:44px;height:44px;flex:none;border:0;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:18px;font-weight:800;cursor:pointer}.send:disabled{opacity:.45;cursor:default}
.hint{text-align:center;color:#53617a;font-size:10px;margin-top:6px}
.typing{display:inline-flex;gap:4px;align-items:center}.typing i{width:5px;height:5px;border-radius:50%;background:#8b98b2;animation:b .9s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.25;transform:translateY(-2px)}}
@media(max-width:600px){header{height:62px;padding:8px 11px}.logo{width:39px;height:39px;border-radius:12px}.brand b{font-size:17px}.head-actions{gap:5px}.icon-btn{width:35px;height:35px}.msg{max-width:90%;font-size:14px}.welcome{padding-top:7vh}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">Z</div>
  <div class="brand"><b>زيريوس AI</b><span>مساعدك الذكي</span></div>
  <div class="head-actions"><button class="icon-btn" id="clear" title="مسح المحادثة">⌫</button></div>
</header>
<main id="chat"><div class="chat-inner" id="chatInner">
  <section class="welcome" id="welcome"><div class="orb">Z</div><h1>مرحبًا، أنا زيريوس</h1><p>اكتب ما تريد وسأساعدك. مفاتيح مزودي الذكاء الاصطناعي محفوظة على الخادم.</p></section>
</div></main>
<div id="status">جارٍ فحص الاتصال...</div>
<div class="composer"><div class="composer-inner"><textarea id="input" placeholder="اكتب رسالتك..." rows="1"></textarea><button class="send" id="send" aria-label="إرسال">➤</button></div><div class="hint">Enter للإرسال • Shift + Enter لسطر جديد</div></div>
</div>
<script>
const chat=document.getElementById("chat"),inner=document.getElementById("chatInner"),welcome=document.getElementById("welcome"),input=document.getElementById("input"),send=document.getElementById("send"),status=document.getElementById("status"),clearBtn=document.getElementById("clear");
let history=[];
try{history=JSON.parse(localStorage.getItem("zereos_history")||"[]")}catch{}
function save(){localStorage.setItem("zereos_history",JSON.stringify(history.slice(-24)))}
function scroll(){chat.scrollTop=chat.scrollHeight}
function add(text,who,meta=""){if(welcome)welcome.style.display="none";const row=document.createElement("div");row.className="msg-row "+who;const box=document.createElement("div");box.className="msg";box.textContent=text;row.appendChild(box);inner.appendChild(row);if(meta){const m=document.createElement("div");m.className="meta";m.textContent=meta;box.appendChild(m)}scroll()}
function restore(){for(const m of history){if(m.role==="user")add(m.content,"user");else if(m.role==="assistant")add(m.content,"ai")}}
async function health(){try{const r=await fetch("/api/health",{cache:"no-store"});const d=await r.json();status.textContent=d.ok?"متصل • "+((d.providers||[]).length)+" مزود متاح":"الخدمة غير متاحة"}catch{status.textContent="تعذر فحص الاتصال"}}
function resize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,150)+"px"}
async function submit(){const message=input.value.trim();if(!message||send.disabled)return;add(message,"user");history.push({role:"user",content:message});save();input.value="";resize();send.disabled=true;status.innerHTML='<span class="typing">زيريوس يفكر <i></i><i></i><i></i></span>';try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,history:history.slice(0,-1)})});const d=await r.json();if(!r.ok)throw new Error(d.error||"حدث خطأ");add(d.reply,"ai");history.push({role:"assistant",content:d.reply});save();status.textContent="جاهز"+(d.provider?" • "+d.provider:"")}catch(e){add("تعذر الحصول على رد الآن. حاول مرة أخرى.","ai");status.textContent="تعذر الاتصال بالخدمة"}finally{send.disabled=false;input.focus()}}
send.onclick=submit;input.addEventListener("input",resize);input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submit()}});clearBtn.onclick=()=>{history=[];save();inner.innerHTML="";inner.appendChild(welcome);welcome.style.display="block";status.textContent="تم مسح المحادثة";input.focus()};restore();health();input.focus();
</script>
</body>
</html>
