<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zereos AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:18px 20px;border-bottom:1px solid #26304a;background:#10172b}header strong{font-size:22px}header span{display:block;color:#94a3b8;font-size:13px;margin-top:3px}
#chat{flex:1;overflow:auto;padding:20px;max-width:900px;width:100%;margin:auto}.msg{padding:13px 15px;border-radius:16px;margin:10px 0;white-space:pre-wrap;line-height:1.65;max-width:85%}.user{background:#263b68;margin-right:auto}.ai{background:#182237;margin-left:auto}
#status{text-align:center;color:#94a3b8;font-size:12px;padding:5px}.bar{padding:12px;display:flex;gap:8px;max-width:900px;width:100%;margin:auto}.bar textarea{flex:1;resize:none;min-height:52px;max-height:140px;border:1px solid #334155;border-radius:14px;background:#111827;color:#fff;padding:13px;font:inherit}.bar button{width:82px;border:0;border-radius:14px;background:#4f7cff;color:#fff;font-weight:700}.bar button:disabled{opacity:.5}
</style>
</head>
<body>
<header><strong>زيريوس AI</strong><span>مساعدك الذكي — المفاتيح محفوظة على الخادم ولا تحتاج لإدخالها</span></header>
<main id="chat"><div class="msg ai">مرحبًا! أنا زيريوس. اكتب رسالتك وسأجيبك.</div></main>
<div id="status"></div>
<div class="bar"><textarea id="input" placeholder="اكتب رسالتك..." rows="1"></textarea><button id="send">إرسال</button></div>
<script>
const chat=document.getElementById("chat"), input=document.getElementById("input"), send=document.getElementById("send"), status=document.getElementById("status");
const history=[];
function add(text,cls){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
async function submit(){
 const message=input.value.trim(); if(!message||send.disabled)return;
 add(message,"user"); input.value=""; send.disabled=true; status.textContent="زيريوس يفكر...";
 try{
   const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,history})});
   const data=await r.json(); if(!r.ok)throw new Error(data.error||"حدث خطأ");
   add(data.reply,"ai"); history.push({role:"user",content:message},{role:"assistant",content:data.reply});
   status.textContent="المحرك: "+data.provider;
 }catch(e){add("تعذر الحصول على رد: "+e.message,"ai");status.textContent="خطأ"}
 finally{send.disabled=false;input.focus()}
}
send.onclick=submit; input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submit()}});
</script>
</body></html>
